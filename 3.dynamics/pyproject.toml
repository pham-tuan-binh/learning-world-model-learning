[project]
name = "dynamics"
version = "0.1.0"
description = "Genie-style token dynamics model for interactive world models"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "einops>=0.7.0",
    "video-tokenizer",
    "inverse-dynamics",
]

[tool.uv.sources]
video-tokenizer = { workspace = true }
inverse-dynamics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dynamics"]
